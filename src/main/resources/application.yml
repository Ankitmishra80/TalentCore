# ===================================================================
# TalentCore Core Application Configuration
# ===================================================================
spring:
  application:
    name: talentcore
  profiles:
    active: dev

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8081
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
