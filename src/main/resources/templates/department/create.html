<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Department')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid" style="max-width: 800px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-plus-circle text-primary me-2"></i>Create Department</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/departments}">Departments</a></li>
                            <li class="breadcrumb-item active">New</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Department Configuration</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/departments/create}" th:object="${deptForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Company <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{companyId}" required>
                                    <option value="">-- Select Company --</option>
                                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('companyId')}" th:errors="*{companyId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Department Code</label>
                                <input type="text" class="form-control" th:field="*{departmentCode}" placeholder="e.g. DEPT-ENG">
                            </div>

                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{departmentName}" placeholder="e.g. Engineering & IT" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('departmentName')}" th:errors="*{departmentName}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Short Name</label>
                                <input type="text" class="form-control" th:field="*{shortName}" placeholder="e.g. ENG">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Department responsibilities"></textarea>
                            </div>

                            <div class="col-md-12">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusSwitch">
                                    <label class="form-check-label fw-semibold" for="statusSwitch">Active Department</label>
                                </div>
                            </div>

                            <div class="col-md-12 pt-3 border-top d-flex justify-content-end gap-2">
                                <a th:href="@{/departments}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Save Department</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
