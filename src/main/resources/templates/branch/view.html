<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Branch Details')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid" style="max-width: 900px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-building text-primary me-2"></i>Branch Details</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/branches}">Branches</a></li>
                            <li class="breadcrumb-item active" th:text="${branch.branchName}">Details</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/branches/edit/{id}(id=${branch.id})}" class="btn btn-outline-primary">
                        <i class="fas fa-pen-to-square me-1"></i> Edit Branch
                    </a>
                    <a th:href="@{/branches}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Back to List
                    </a>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold" th:text="${branch.branchName}">Branch Name</h5>
                    <span class="status-badge"
                          th:classappend="${branch.status ? 'status-active' : 'status-inactive'}"
                          th:text="${branch.status ? 'Active' : 'Inactive'}">Active</span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-sm-6">
                            <label class="text-muted small">Branch Code</label>
                            <div class="fw-bold fs-5 text-primary" th:text="${branch.branchCode}">BR-01</div>
                        </div>
                        <div class="col-sm-6">
                            <label class="text-muted small">Parent Company</label>
                            <div class="fw-semibold" th:text="${branch.companyName}">Company</div>
                        </div>

                        <div class="col-sm-6">
                            <label class="text-muted small">City & State</label>
                            <div class="fw-semibold">
                                <span th:text="${branch.city != null ? branch.city : '-'}">City</span>, 
                                <span th:text="${branch.state != null ? branch.state : '-'}">State</span>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <label class="text-muted small">Active Employees</label>
                            <div><span class="badge bg-primary" th:text="${branch.activeEmployeeCount} + ' Active Employees'">0 Active Employees</span></div>
                        </div>

                        <div class="col-sm-6">
                            <label class="text-muted small">Contact Phone</label>
                            <div class="fw-semibold" th:text="${branch.contactNumber != null ? branch.contactNumber : '-'}">+91 0000000000</div>
                        </div>
                        <div class="col-sm-6">
                            <label class="text-muted small">Official Email</label>
                            <div class="fw-semibold" th:text="${branch.email != null ? branch.email : '-'}">branch@company.com</div>
                        </div>

                        <div class="col-sm-12">
                            <label class="text-muted small">Physical Address</label>
                            <div class="fw-semibold" th:text="${branch.address != null ? branch.address : '-'}">Full address</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
