<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Branch Management')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Breadcrumb & Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-network-wired text-primary me-2"></i>Branch Management</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item active">Branches</li>
                        </ol>
                    </nav>
                </div>
                <div>
                    <a th:href="@{/branches/create}" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i> Add Branch
                    </a>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Filters Card -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/branches}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold text-secondary">Search Branches</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search by name, code or city...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Status Filter</label>
                            <select class="form-select" name="status">
                                <option value="all" th:selected="${status == 'all'}">All Branches</option>
                                <option value="active" th:selected="${status == 'active'}">Active</option>
                                <option value="inactive" th:selected="${status == 'inactive'}">Inactive</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label small fw-semibold text-secondary">Page Size</label>
                            <select class="form-select" name="size">
                                <option value="5" th:selected="${pageSize == 5}">5 per page</option>
                                <option value="10" th:selected="${pageSize == 10}">10 per page</option>
                                <option value="25" th:selected="${pageSize == 25}">25 per page</option>
                            </select>
                        </div>

                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-filter me-1"></i> Filter</button>
                            <a th:href="@{/branches}" class="btn btn-outline-secondary" title="Reset"><i class="fas fa-rotate-right"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Code</th>
                                    <th>Branch Name</th>
                                    <th>Company</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="branch : ${branches.content}">
                                    <td class="ps-4 fw-semibold text-primary" th:text="${branch.branchCode}">BR-001</td>
                                    <td class="fw-bold" th:text="${branch.branchName}">Bengaluru Hub</td>
                                    <td th:text="${branch.companyName}">TalentCore Solutions</td>
                                    <td>
                                        <span th:text="${branch.city}">City</span>, 
                                        <span th:text="${branch.state}" class="text-muted small">State</span>
                                    </td>
                                    <td>
                                        <span class="status-badge" 
                                              th:classappend="${branch.status ? 'status-active' : 'status-inactive'}" 
                                              th:text="${branch.status ? 'Active' : 'Inactive'}">Active</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/branches/view/{id}(id=${branch.id})}" class="btn btn-outline-info" title="View Details">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/branches/edit/{id}(id=${branch.id})}" class="btn btn-outline-secondary" title="Edit">
                                                <i class="fas fa-pen-to-square"></i>
                                            </a>
                                            <form th:action="@{/branches/toggle-status/{id}(id=${branch.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <input type="hidden" name="active" th:value="${!branch.status}"/>
                                                <button type="submit" class="btn" 
                                                        th:classappend="${branch.status ? 'btn-outline-danger' : 'btn-outline-success'}"
                                                        th:title="${branch.status ? 'Deactivate Branch' : 'Activate Branch'}">
                                                    <i th:class="${branch.status ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(branches.content)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-folder-open fa-3x mb-3 text-secondary"></i>
                                        <h5>No Branches Found</h5>
                                        <p class="small mb-0">Try adjusting your search criteria or register a new branch.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination Footer -->
                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${branches.totalPages > 1}">
                    <span class="small text-muted">
                        Page <strong th:text="${branches.pageNumber + 1}">1</strong> of <strong th:text="${branches.totalPages}">1</strong>
                        (Total <span th:text="${branches.totalElements}">0</span> entries)
                    </span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${branches.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/branches(page=${currentPage - 1}, size=${pageSize}, search=${search}, status=${status})}">Previous</a>
                            </li>
                            <li class="page-item" th:classappend="${branches.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/branches(page=${currentPage + 1}, size=${pageSize}, search=${search}, status=${status})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
