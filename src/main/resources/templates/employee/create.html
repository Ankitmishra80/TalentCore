<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Enrol Employee')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid" style="max-width: 950px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-user-plus text-primary me-2"></i>Enrol New Employee</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/employees}">Employees</a></li>
                            <li class="breadcrumb-item active">New</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Personal & Employment Particulars</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/employees/create}" th:object="${empForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Employee Code</label>
                                <input type="text" class="form-control" th:field="*{employeeCode}" placeholder="Leave blank to auto-generate">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Company <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{companyId}" required id="companySelect">
                                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Primary Branch</label>
                                <select class="form-select" th:field="*{branchId}">
                                    <option value="">-- Unassigned --</option>
                                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.branchName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{departmentId}" required id="departmentSelect">
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.departmentName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Designation <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{designationId}" required id="designationSelect">
                                    <option th:each="desig : ${designations}" th:value="${desig.id}" th:text="${desig.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Official Email</label>
                                <input type="email" class="form-control" th:field="*{officialEmail}" placeholder="john@talentcore.com">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Mobile Number</label>
                                <input type="text" class="form-control" th:field="*{mobileNumber}" placeholder="+91 9876543210">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Gender</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Date of Birth</label>
                                <input type="date" class="form-control" th:field="*{dateOfBirth}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Joining Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" th:field="*{joiningDate}" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Employment Type</label>
                                <select class="form-select" th:field="*{employmentType}">
                                    <option value="FULL_TIME">Full Time</option>
                                    <option value="PART_TIME">Part Time</option>
                                    <option value="CONTRACT">Contract</option>
                                    <option value="INTERN">Intern</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">PAN Number</label>
                                <input type="text" class="form-control" th:field="*{panNumber}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Aadhaar Number</label>
                                <input type="text" class="form-control" th:field="*{aadharNumber}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Reporting Manager</label>
                                <select class="form-select" th:field="*{reportingManagerId}">
                                    <option value="">-- None --</option>
                                    <option th:each="m : ${managers}" th:value="${m.id}" th:text="${m.fullName}"></option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Address</label>
                                <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
                            </div>

                            <div class="col-md-12 pt-3 border-top d-flex justify-content-end gap-2">
                                <a th:href="@{/employees}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Save Employee</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
