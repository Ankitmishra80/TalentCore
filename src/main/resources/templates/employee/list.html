<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Employee Directory')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-users text-primary me-2"></i>Employee Directory</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item active">Employees</li>
                        </ol>
                    </nav>
                </div>
                <div>
                    <a th:href="@{/employees/create}" class="btn btn-primary">
                        <i class="fas fa-user-plus me-1"></i> Enrol Employee
                    </a>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Filters -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/employees}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Search</label>
                            <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search code, name, email...">
                        </div>

                        <div class="col-md-2">
                            <label class="form-label small fw-semibold text-secondary">Company</label>
                            <select class="form-select" name="companyId">
                                <option value="">All Companies</option>
                                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}" th:selected="${companyId == c.id}"></option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label small fw-semibold text-secondary">Department</label>
                            <select class="form-select" name="departmentId">
                                <option value="">All Departments</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.departmentName}" th:selected="${departmentId == d.id}"></option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label small fw-semibold text-secondary">Status</label>
                            <select class="form-select" name="status">
                                <option value="all" th:selected="${status == 'all'}">All</option>
                                <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">Active</option>
                                <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Inactive</option>
                                <option value="RESIGNED" th:selected="${status == 'RESIGNED'}">Resigned</option>
                            </select>
                        </div>

                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-filter me-1"></i> Filter</button>
                            <a th:href="@{/employees}" class="btn btn-outline-secondary" title="Reset"><i class="fas fa-rotate-right"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Code</th>
                                    <th>Employee Name</th>
                                    <th>Designation / Dept</th>
                                    <th>Active Branch</th>
                                    <th>Joining Date</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="emp : ${employees.content}">
                                    <td class="ps-4 fw-semibold text-primary" th:text="${emp.employeeCode}">TC-EMP-0001</td>
                                    <td>
                                        <div class="fw-bold" th:text="${emp.fullName}">Jane Smith</div>
                                        <div class="small text-muted" th:text="${emp.officialEmail != null ? emp.officialEmail : '-'}">jane@talentcore.com</div>
                                    </td>
                                    <td>
                                        <div th:text="${emp.designationName}">Engineer</div>
                                        <div class="small text-muted" th:text="${emp.departmentName}">IT</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-light text-primary border" th:text="${emp.branchName}">Delhi HQ</span>
                                    </td>
                                    <td th:text="${emp.joiningDate}">2026-01-01</td>
                                    <td>
                                        <span class="status-badge"
                                              th:classappend="${emp.status == 'ACTIVE' ? 'status-active' : 'status-inactive'}"
                                              th:text="${emp.status}">ACTIVE</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/employees/view/{id}(id=${emp.id})}" class="btn btn-outline-info" title="View Profile">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-outline-secondary" title="Edit">
                                                <i class="fas fa-pen-to-square"></i>
                                            </a>
                                            <form th:action="@{/employees/status/{id}(id=${emp.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <input type="hidden" name="status" th:value="${emp.status == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}"/>
                                                <button type="submit" class="btn"
                                                        th:classappend="${emp.status == 'ACTIVE' ? 'btn-outline-danger' : 'btn-outline-success'}"
                                                        th:title="${emp.status == 'ACTIVE' ? 'Deactivate' : 'Activate'}">
                                                    <i th:class="${emp.status == 'ACTIVE' ? 'fas fa-user-slash' : 'fas fa-user-check'}"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(employees.content)}">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <i class="fas fa-folder-open fa-3x mb-3 text-secondary"></i>
                                        <h5>No Employees Found</h5>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${employees.totalPages > 1}">
                    <span class="small text-muted">
                        Page <strong th:text="${employees.pageNumber + 1}">1</strong> of <strong th:text="${employees.totalPages}">1</strong>
                    </span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${employees.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/employees(page=${currentPage - 1}, size=${pageSize}, search=${search}, companyId=${companyId}, departmentId=${departmentId}, status=${status})}">Previous</a>
                            </li>
                            <li class="page-item" th:classappend="${employees.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/employees(page=${currentPage + 1}, size=${pageSize}, search=${search}, companyId=${companyId}, departmentId=${departmentId}, status=${status})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
