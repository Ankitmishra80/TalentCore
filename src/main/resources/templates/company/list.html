<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Company Management')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-briefcase text-primary me-2"></i>Company Management</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item active">Companies</li>
                        </ol>
                    </nav>
                </div>
                <div>
                    <a th:href="@{/companies/create}" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i> Add Company
                    </a>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Filters -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/companies}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Search Companies</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search by name, code or short name...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Status</label>
                            <select class="form-select" name="status">
                                <option value="all" th:selected="${status == 'all'}">All Statuses</option>
                                <option value="active" th:selected="${status == 'active'}">Active</option>
                                <option value="inactive" th:selected="${status == 'inactive'}">Inactive</option>
                            </select>
                        </div>

                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-filter me-1"></i> Filter</button>
                            <a th:href="@{/companies}" class="btn btn-outline-secondary" title="Reset"><i class="fas fa-rotate-right"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Code</th>
                                    <th>Company Name</th>
                                    <th>Contact Person</th>
                                    <th>Email / Phone</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="comp : ${companies.content}">
                                    <td class="ps-4 fw-semibold text-primary" th:text="${comp.code}">TAL-01</td>
                                    <td>
                                        <div class="fw-bold" th:text="${comp.name}">Company Name</div>
                                        <div class="small text-muted" th:text="${comp.shortName}">Short</div>
                                    </td>
                                    <td th:text="${comp.contactPersonName}">John Doe</td>
                                    <td>
                                        <div th:text="${comp.contactPersonEmail}">admin@company.com</div>
                                        <div class="small text-muted" th:text="${comp.contactPersonPhone}">9876543210</div>
                                    </td>
                                    <td>
                                        <span class="status-badge"
                                              th:classappend="${comp.status ? 'status-active' : 'status-inactive'}"
                                              th:text="${comp.status ? 'Active' : 'Inactive'}">Active</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/companies/view/{id}(id=${comp.id})}" class="btn btn-outline-info" title="View Details">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/companies/edit/{id}(id=${comp.id})}" class="btn btn-outline-secondary" title="Edit">
                                                <i class="fas fa-pen-to-square"></i>
                                            </a>
                                            <form th:action="@{/companies/toggle-status/{id}(id=${comp.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <input type="hidden" name="active" th:value="${!comp.status}"/>
                                                <button type="submit" class="btn"
                                                        th:classappend="${comp.status ? 'btn-outline-danger' : 'btn-outline-success'}"
                                                        th:title="${comp.status ? 'Deactivate Company' : 'Activate Company'}">
                                                    <i th:class="${comp.status ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(companies.content)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-folder-open fa-3x mb-3 text-secondary"></i>
                                        <h5>No Companies Found</h5>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${companies.totalPages > 1}">
                    <span class="small text-muted">
                        Page <strong th:text="${companies.pageNumber + 1}">1</strong> of <strong th:text="${companies.totalPages}">1</strong>
                        (Total <span th:text="${companies.totalElements}">0</span>)
                    </span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${companies.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/companies(page=${currentPage - 1}, size=${pageSize}, search=${search}, status=${status})}">Previous</a>
                            </li>
                            <li class="page-item" th:classappend="${companies.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/companies(page=${currentPage + 1}, size=${pageSize}, search=${search}, status=${status})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
