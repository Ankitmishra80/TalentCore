<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Company')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid" style="max-width: 900px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-pen-to-square text-primary me-2"></i>Edit Company</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/companies}">Companies</a></li>
                            <li class="breadcrumb-item active">Edit</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Update Company Profile</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/companies/edit/{id}(id=${companyId})}" th:object="${companyForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Company Code <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{code}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Short Name</label>
                                <input type="text" class="form-control" th:field="*{shortName}">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Full Legal Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Contact Person</label>
                                <input type="text" class="form-control" th:field="*{contactPersonName}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" th:field="*{contactPersonEmail}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" class="form-control" th:field="*{contactPersonPhone}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">GSTIN</label>
                                <input type="text" class="form-control" th:field="*{gstNo}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">PAN</label>
                                <input type="text" class="form-control" th:field="*{panNo}">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">CIN</label>
                                <input type="text" class="form-control" th:field="*{cinNo}">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Registered Office Address</label>
                                <textarea class="form-control" th:field="*{address}" rows="3"></textarea>
                            </div>

                            <div class="col-md-12">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusSwitch">
                                    <label class="form-check-label fw-semibold" for="statusSwitch">Active Entity</label>
                                </div>
                            </div>

                            <div class="col-md-12 pt-3 border-top d-flex justify-content-end gap-2">
                                <a th:href="@{/companies}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Update Company</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
