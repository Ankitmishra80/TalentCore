<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Company Details')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid" style="max-width: 900px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-building-columns text-primary me-2"></i>Company Details</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/companies}">Companies</a></li>
                            <li class="breadcrumb-item active" th:text="${company.name}">Details</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/companies/edit/{id}(id=${company.id})}" class="btn btn-outline-primary">
                        <i class="fas fa-pen-to-square me-1"></i> Edit Company
                    </a>
                    <a th:href="@{/companies}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Back to List
                    </a>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold" th:text="${company.name}">Company Name</h5>
                    <span class="status-badge"
                          th:classappend="${company.status ? 'status-active' : 'status-inactive'}"
                          th:text="${company.status ? 'Active' : 'Inactive'}">Active</span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-sm-6">
                            <label class="text-muted small">Company Code</label>
                            <div class="fw-bold fs-5 text-primary" th:text="${company.code}">TAL-01</div>
                        </div>
                        <div class="col-sm-6">
                            <label class="text-muted small">Short / Brand Name</label>
                            <div class="fw-semibold" th:text="${company.shortName != null ? company.shortName : '-'}">TalentCore</div>
                        </div>

                        <div class="col-sm-6">
                            <label class="text-muted small">Contact Person</label>
                            <div class="fw-semibold" th:text="${company.contactPersonName != null ? company.contactPersonName : '-'}">John Doe</div>
                        </div>
                        <div class="col-sm-6">
                            <label class="text-muted small">Official Contact Email</label>
                            <div class="fw-semibold" th:text="${company.contactPersonEmail != null ? company.contactPersonEmail : '-'}">admin@company.com</div>
                        </div>

                        <div class="col-sm-6">
                            <label class="text-muted small">Phone Number</label>
                            <div class="fw-semibold" th:text="${company.contactPersonPhone != null ? company.contactPersonPhone : '-'}">+91 0000000000</div>
                        </div>
                        <div class="col-sm-6">
                            <label class="text-muted small">Registered Address</label>
                            <div class="fw-semibold" th:text="${company.address != null ? company.address : '-'}">Address details</div>
                        </div>

                        <div class="col-sm-4">
                            <label class="text-muted small">GSTIN Number</label>
                            <div class="fw-semibold" th:text="${company.gstNo != null ? company.gstNo : '-'}">N/A</div>
                        </div>
                        <div class="col-sm-4">
                            <label class="text-muted small">PAN Number</label>
                            <div class="fw-semibold" th:text="${company.panNo != null ? company.panNo : '-'}">N/A</div>
                        </div>
                        <div class="col-sm-4">
                            <label class="text-muted small">CIN Number</label>
                            <div class="fw-semibold" th:text="${company.cinNo != null ? company.cinNo : '-'}">N/A</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
