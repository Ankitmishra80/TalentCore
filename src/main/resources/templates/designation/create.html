<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Designation')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid" style="max-width: 800px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-plus-circle text-primary me-2"></i>Create Designation</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/designations}">Designations</a></li>
                            <li class="breadcrumb-item active">New</li>
                        </ol>
                    </nav>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">Designation Configuration</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/designations/create}" th:object="${desigForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{departmentId}" required>
                                    <option value="">-- Select Department --</option>
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.departmentName} + ' (' + ${d.companyName} + ')'"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Short Code</label>
                                <input type="text" class="form-control" th:field="*{shortName}" placeholder="e.g. TL">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Designation Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Technical Lead" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Description / Role Summary</label>
                                <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Key responsibilities"></textarea>
                            </div>

                            <div class="col-md-12">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusSwitch">
                                    <label class="form-check-label fw-semibold" for="statusSwitch">Active Designation</label>
                                </div>
                            </div>

                            <div class="col-md-12 pt-3 border-top d-flex justify-content-end gap-2">
                                <a th:href="@{/designations}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-1"></i> Save Designation</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
