<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Designation Management')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="d-flex flex-grow-1">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="fas fa-id-badge text-primary me-2"></i>Designation Management</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0 small">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                            <li class="breadcrumb-item active">Designations</li>
                        </ol>
                    </nav>
                </div>
                <div>
                    <a th:href="@{/designations/create}" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i> Add Designation
                    </a>
                </div>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Filters -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form th:action="@{/designations}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold text-secondary">Search Designation</label>
                            <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search name...">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Company</label>
                            <select class="form-select" name="companyId">
                                <option value="">All Companies</option>
                                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}" th:selected="${companyId == c.id}"></option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-semibold text-secondary">Status</label>
                            <select class="form-select" name="status">
                                <option value="all" th:selected="${status == 'all'}">All</option>
                                <option value="active" th:selected="${status == 'active'}">Active</option>
                                <option value="inactive" th:selected="${status == 'inactive'}">Inactive</option>
                            </select>
                        </div>

                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-filter me-1"></i> Filter</button>
                            <a th:href="@{/designations}" class="btn btn-outline-secondary" title="Reset"><i class="fas fa-rotate-right"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Designation Name</th>
                                    <th>Department</th>
                                    <th>Company</th>
                                    <th>Short Code</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="desig : ${designations.content}">
                                    <td class="ps-4 fw-bold text-dark" th:text="${desig.name}">Software Engineer</td>
                                    <td th:text="${desig.departmentName}">IT</td>
                                    <td th:text="${desig.companyName}">Company</td>
                                    <td th:text="${desig.shortName != null ? desig.shortName : '-'}">SE</td>
                                    <td>
                                        <span class="status-badge"
                                              th:classappend="${desig.status ? 'status-active' : 'status-inactive'}"
                                              th:text="${desig.status ? 'Active' : 'Inactive'}">Active</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/designations/edit/{id}(id=${desig.id})}" class="btn btn-outline-secondary" title="Edit">
                                                <i class="fas fa-pen-to-square"></i>
                                            </a>
                                            <form th:action="@{/designations/toggle-status/{id}(id=${desig.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <input type="hidden" name="active" th:value="${!desig.status}"/>
                                                <button type="submit" class="btn"
                                                        th:classappend="${desig.status ? 'btn-outline-danger' : 'btn-outline-success'}"
                                                        th:title="${desig.status ? 'Deactivate' : 'Activate'}">
                                                    <i th:class="${desig.status ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(designations.content)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-folder-open fa-3x mb-3 text-secondary"></i>
                                        <h5>No Designations Found</h5>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${designations.totalPages > 1}">
                    <span class="small text-muted">
                        Page <strong th:text="${designations.pageNumber + 1}">1</strong> of <strong th:text="${designations.totalPages}">1</strong>
                    </span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${designations.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/designations(page=${currentPage - 1}, size=${pageSize}, search=${search}, companyId=${companyId}, status=${status})}">Previous</a>
                            </li>
                            <li class="page-item" th:classappend="${designations.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/designations(page=${currentPage + 1}, size=${pageSize}, search=${search}, companyId=${companyId}, status=${status})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
